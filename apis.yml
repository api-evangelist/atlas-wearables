name: Atlas Wearables
description: >-
  Atlas Wearables was an Austin, Texas fitness-technology startup founded in 2013 by Peter Li,
  Mike Kasparian, and Alex Hsieh. It raised over $500,000 on Indiegogo in 2014 for the Atlas
  Wristband, a motion-tracking gym wearable whose "Exercise ID" technology automatically
  recognized strength exercises and counted reps and sets. The company shipped the Atlas
  Wristband and Wristband 2 and historically promoted an open developer API and integrations
  with apps such as MapMyFitness and Fitocracy. Atlas Wearables was acquired by Peloton
  Interactive in late 2020; the company no longer operates independently and the
  atlaswearables.com domain no longer resolves (it is now held by Peloton Interactive). This
  API Evangelist profile is retained as a historical record of a former Techstars-associated
  portfolio lead; no live developer surface, API specification, or documentation remains
  available to enrich.
